version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_club}
      POSTGRES_USER: ${POSTGRES_USER:-aiclub_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DEBUG: 'True'
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.local}
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiclub_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}@db:5432/${POSTGRES_DB:-ai_club}
      ALLOWED_HOSTS: 'localhost,127.0.0.1'
    depends_on:
      - db

volumes:
  postgres_data:
